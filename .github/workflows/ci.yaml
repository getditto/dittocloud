name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod
      - uses: golangci/golangci-lint-action@v9
  tf-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.2
          # The migration assertion parses raw `terraform test -json` output.
          terraform_wrapper: false
      - run: |
          terraform init
          terraform validate
          terraform fmt -check
      - name: Test AWS Terraform
        run: |
          terraform -chdir=terraform/aws init -backend=false -input=false
          terraform -chdir=terraform/aws test -no-color
          terraform/aws/tests/assert_legacy_to_default.sh
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: write # Write the report in git notes
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod
      - run: go test -v ./...
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod
      - run: go build -v ./...
